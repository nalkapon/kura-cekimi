name: Deploy Backend to Render (trigger)

on:
  workflow_dispatch: {}
  push:
    paths:
      - 'backend/**'

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trigger Render deploy via API
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_BACKEND: ${{ secrets.RENDER_SERVICE_ID_BACKEND }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID_BACKEND" ]; then
            echo "Missing required secrets: RENDER_API_KEY and/or RENDER_SERVICE_ID_BACKEND" >&2
            exit 1
          fi
          echo "Triggering Render deploy for service $RENDER_SERVICE_ID_BACKEND"
          curl -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":true}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID_BACKEND/deploys"
